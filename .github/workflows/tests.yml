name: Tests

permissions:
    id-token: write
    contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: "macos-latest"
            python-version: "3.14"
          - os: "windows-latest"
            python-version: "3.14"
    name: Python ${{ matrix.python-version }} on OS ${{ matrix.os }}
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.BIGQUERY_WIF_PROVIDER }}
          service_account: ${{ secrets.BIGQUERY_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv sync

      - name: Run tests
        run: uv run poe test

      - name: Run live BigQuery tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        env:
          KOALITY_BIGQUERY_LIVE: "1"
          KOALITY_BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_TEST_PROJECT }}
          KOALITY_BIGQUERY_DATASET: ${{ vars.BIGQUERY_TEST_DATASET }}
          KOALITY_BIGQUERY_TABLE: ${{ vars.BIGQUERY_TEST_TABLE }}
          KOALITY_BIGQUERY_COLUMN: ${{ vars.BIGQUERY_TEST_COLUMN }}
          KOALITY_BIGQUERY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: uv run poe test_bigquery_live
